version: '3.8'

services:
  study-buddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-buddy-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
